# =====================================================================
# ShopSphere AI - local environment (Docker Compose v2)
#
# Profiles let you start only what your RAM allows:
#   app        postgres + backend + frontend            (~1.5 GB)
#   ai         ollama (local LLM)                        (2-4 GB)
#   ci         jenkins + sonarqube + nexus               (~6 GB)  -> preferably on a training VM
#   monitoring prometheus + alertmanager + grafana + node-exporter + mailpit (~1 GB)
#
#   cp .env.example .env          # then edit the <CHANGE_ME> values
#   docker compose --profile app up -d --build
#   docker compose --profile app --profile ai --profile monitoring up -d
#   docker compose --profile app down          # add -v to also delete data volumes
#
# Open: shop http://localhost:3000 · API http://localhost:8080/actuator/health
#       Jenkins :8085 · SonarQube :9000 · Nexus :8081 · Prometheus :9090
#       Grafana :3001 · Alertmanager :9093 · Mailpit :8025
# =====================================================================
name: shopsphere

x-restart: &restart
  restart: unless-stopped

services:
  # ---------------------------- app ----------------------------
  postgres:
    <<: *restart
    image: postgres:17-alpine
    profiles: ["app"]
    environment:
      POSTGRES_DB: ${DB_NAME:-shopsphere}
      POSTGRES_USER: ${DB_USERNAME:-shopsphere}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [shopsphere-net]

  backend:
    <<: *restart
    build: ./backend
    image: shopsphere-backend:local
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-shopsphere}
      DB_USERNAME: ${DB_USERNAME:-shopsphere}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -base64 64)}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@shopsphere.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-}
      IMAGE_TAG: local
    ports: ["8080:8080"]
    networks: [shopsphere-net]

  frontend:
    <<: *restart
    build:
      context: ./frontend
      args:
        VITE_BUILD_SHA: local
    image: shopsphere-frontend:local
    profiles: ["app"]
    depends_on: [backend]
    environment:
      BACKEND_URL: http://backend:8080
    ports: ["3000:8080"]
    networks: [shopsphere-net]

  # ---------------------------- ai -----------------------------
  ollama:
    <<: *restart
    image: ollama/ollama:latest
    profiles: ["ai"]
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
    networks: [shopsphere-net]

  # ---------------------------- ci -----------------------------
  jenkins:
    <<: *restart
    build: ./jenkins
    image: shopsphere-jenkins:local
    profiles: ["ci"]
    user: root   # training only: needed to use the host Docker socket (see docs/devops/jenkins.md)
    ports: ["8085:8080", "50000:50000"]
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./jenkins/casc:/var/jenkins_casc:ro
    environment:
      # Optional Configuration-as-Code: set CASC_JENKINS_CONFIG=/var/jenkins_casc/enabled in .env
      CASC_JENKINS_CONFIG: ${CASC_JENKINS_CONFIG:-/var/jenkins_casc/disabled}
      JAVA_OPTS: ${JENKINS_JAVA_OPTS:-}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-}
      JENKINS_URL: ${JENKINS_URL:-http://localhost:8085/}
      GITHUB_USER: ${GITHUB_USER:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SONAR_TOKEN: ${SONAR_TOKEN:-}
      NEXUS_USER: ${NEXUS_USER:-}
      NEXUS_PASSWORD: ${NEXUS_PASSWORD:-}
      AWS_JENKINS_ACCESS_KEY_ID: ${AWS_JENKINS_ACCESS_KEY_ID:-}
      AWS_JENKINS_SECRET_ACCESS_KEY: ${AWS_JENKINS_SECRET_ACCESS_KEY:-}
      NVD_API_KEY: ${NVD_API_KEY:-}
    networks: [shopsphere-net]

  sonarqube:
    <<: *restart
    image: sonarqube:community
    profiles: ["ci"]
    ports: ["9000:9000"]
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"   # training only; production: set vm.max_map_count=524288
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks: [shopsphere-net]

  nexus:
    <<: *restart
    image: sonatype/nexus3:latest
    profiles: ["ci"]
    ports: ["8081:8081", "8082:8082"]
    volumes: [nexus_data:/nexus-data]
    networks: [shopsphere-net]

  # ------------------------- monitoring ------------------------
  prometheus:
    <<: *restart
    image: prom/prometheus:latest
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    networks: [shopsphere-net]

  alertmanager:
    <<: *restart
    image: prom/alertmanager:latest
    profiles: ["monitoring"]
    ports: ["9093:9093"]
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks: [shopsphere-net]

  grafana:
    <<: *restart
    image: grafana/grafana:latest
    profiles: ["monitoring"]
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks: [shopsphere-net]

  node-exporter:
    <<: *restart
    image: prom/node-exporter:latest
    profiles: ["monitoring"]
    command: ["--path.rootfs=/host"]
    pid: host
    volumes: ["/:/host:ro,rslave"]
    ports: ["9100:9100"]
    networks: [shopsphere-net]

  mailpit:
    <<: *restart
    image: axllent/mailpit:latest
    profiles: ["monitoring"]
    ports: ["8025:8025", "1025:1025"]
    networks: [shopsphere-net]

networks:
  shopsphere-net:
    name: shopsphere-net

volumes:
  pgdata:
  ollama:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  nexus_data:
  prometheus_data:
  grafana_data:
