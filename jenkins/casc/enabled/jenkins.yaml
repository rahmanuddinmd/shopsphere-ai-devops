# =====================================================================
# Jenkins Configuration-as-Code (optional). Enabled when CASC_JENKINS_CONFIG=/var/jenkins_casc/enabled
# is set in .env (Ansible does this when shopsphere_ci_enable_jcasc: true).
# All secret values come from environment variables in .env (mode 600 on the server) - never from Git.
# Creates: admin user, the 5 pipeline credentials, the "sonarqube" server entry, Jenkins URL.
# The Multibranch job is still created once in the UI (docs/devops/jenkins.md).
# =====================================================================
jenkins:
  systemMessage: "ShopSphere AI CI/CD - configured as code (jenkins/casc/jenkins.yaml)"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "github-credentials"
              description: "GitHub user + fine-grained PAT"
              username: "${GITHUB_USER}"
              password: "${GITHUB_TOKEN}"
          - string:
              scope: GLOBAL
              id: "sonarqube-token"
              description: "SonarQube analysis token"
              secret: "${SONAR_TOKEN}"
          - usernamePassword:
              scope: GLOBAL
              id: "nexus-credentials"
              description: "Nexus deploy user"
              username: "${NEXUS_USER}"
              password: "${NEXUS_PASSWORD}"
          - aws:
              scope: GLOBAL
              id: "aws-jenkins"
              description: "IAM user shopsphere-dev-jenkins"
              accessKey: "${AWS_JENKINS_ACCESS_KEY_ID}"
              secretKey: "${AWS_JENKINS_SECRET_ACCESS_KEY}"
          - string:
              scope: GLOBAL
              id: "nvd-api-key"
              description: "NVD API key for OWASP Dependency-Check"
              secret: "${NVD_API_KEY}"

unclassified:
  location:
    url: "${JENKINS_URL:-http://localhost:8085/}"
  sonarGlobalConfiguration:
    buildWrapperEnabled: false
    installations:
      - name: "sonarqube"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonarqube-token"
