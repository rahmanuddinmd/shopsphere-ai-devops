# =====================================================================
# SonarQube - frontend project (the backend is analysed through Maven: see backend/pom.xml
# <sonar.*> properties and the "SonarQube analysis" stage in the Jenkinsfile).
# Run from repo root:
#   docker run --rm --network shopsphere-net -e SONAR_HOST_URL=http://sonarqube:9000 \
#     -e SONAR_TOKEN=$SONAR_TOKEN -v "$PWD:/usr/src" sonarsource/sonar-scanner-cli \
#     -Dproject.settings=sonarqube/sonar-project.properties
# =====================================================================
sonar.projectKey=shopsphere-frontend
sonar.projectName=ShopSphere Frontend
sonar.sources=frontend/src
sonar.exclusions=frontend/src/test/**
sonar.tests=frontend/src/test
sonar.test.inclusions=frontend/src/test/**
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.sourceEncoding=UTF-8
