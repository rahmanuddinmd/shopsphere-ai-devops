# Alertmanager - local training setup. Alerts are emailed to Mailpit (http://localhost:8025),
# a free local inbox, so no paid notification service is needed.
global:
  smtp_smarthost: mailpit:1025
  smtp_from: alertmanager@shopsphere.local
  smtp_require_tls: false

route:
  receiver: team-email
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: oncall-email
      repeat_interval: 1h

receivers:
  - name: team-email
    email_configs:
      - to: devops-team@shopsphere.local
        send_resolved: true
  - name: oncall-email
    email_configs:
      - to: oncall@shopsphere.local
        send_resolved: true

inhibit_rules:
  # If the backend is down, don't also send "high 5xx" / "slow responses" for it
  - source_matchers: [alertname="ShopSphereBackendDown"]
    target_matchers: [severity="warning"]
    equal: [instance]
