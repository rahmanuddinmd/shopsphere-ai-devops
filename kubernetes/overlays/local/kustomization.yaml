# Local Kubernetes (Docker Desktop / kind / minikube) - no cloud cost.
#   docker compose build backend frontend          # builds shopsphere-*:local images
#   bash scripts/deploy.sh local
#   kubectl port-forward svc/frontend 3000:80 -n shopsphere-local   -> http://localhost:3000
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shopsphere-local
resources:
  - namespace.yaml
  - ../../base
images:
  - name: shopsphere-backend
    newTag: local
  - name: shopsphere-frontend
    newTag: local
patches:
  - path: config-patch.yaml
  - target: { kind: Deployment, name: backend }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: Deployment, name: frontend }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: HorizontalPodAutoscaler, name: backend }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
