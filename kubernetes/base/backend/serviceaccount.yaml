# Identity of the backend pods. On EKS an EKS Pod Identity association
# (terraform/modules/iam) binds this ServiceAccount to an IAM role allowed to call Bedrock.
# No AWS access keys exist anywhere in the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shopsphere-backend
  labels:
    app.kubernetes.io/name: backend
automountServiceAccountToken: false
